<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quizzes – Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main id="main"><p class="loading">Loading…</p></main>

<script>
const { esc, api, me, header, natural, toast, copy, prefs } = Portal;
const main = document.getElementById("main");
let subject = new URLSearchParams(location.search).get("subject") || "";
let quizzes = [], query = "";
const day = d => new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short" });

(async function start() {
  let user;
  try { user = await me(); } catch (e) { if (e.code !== "signin") main.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  if (user.subjects.includes(subject)) Portal.setSubject(subject);
  if (location.search) history.replaceState(null, "", "quizzes.html");
  subject = Portal.getSubject(user);
  header("quizzes", user, { context: true });
  document.addEventListener("portal:class", () => render());
  if (!subject) {
    main.innerHTML = `<div class="panel empty"><strong>No subjects on your account yet</strong><span>Ask an admin to add your subjects on the Users page.</span></div>`;
    return;
  }
  document.title = subject + " quizzes – Teacher Portal";
  main.innerHTML = `
    <div>
      <h1>${esc(subject)} quizzes</h1>
      <p class="lede">Open a chapter, find the topic and copy the quiz link or send it on WhatsApp. Tap Answers to see the answer key. Change subject or class with the button at the top.</p>
    </div>
    <div class="panel">
      <div class="toolbar">
        <div class="field"><label class="label" for="q">Find a topic</label><input class="input" id="q" type="search" placeholder="e.g. taxonomic"></div>
        <div class="field"><label class="label" for="due">Submit by (optional)</label><input class="input" id="due" type="text" placeholder="e.g. Sunday 9 pm"></div>
      </div>
    </div>
    <div id="list"><p class="loading">Loading quizzes…</p></div>`;
  const due = document.getElementById("due");
  due.value = prefs.get("due", "");
  due.oninput = () => prefs.set("due", due.value);
  document.getElementById("q").oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

  try { quizzes = (await api("quizzes", { subject })).quizzes; }
  catch (e) { if (e.code !== "signin") document.getElementById("list").innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  render();
})();

function classLabel(c) { return /^\d+$/.test(c) ? "Class " + c : c; }

function render() {
  const cls = Portal.getClass();

  const list = document.getElementById("list");
  if (!quizzes.length) {
    list.innerHTML = `<div class="panel empty"><strong>No ${esc(subject)} quizzes yet</strong><span>Quizzes appear here as soon as they're created with the quiz builder.</span></div>`;
    return;
  }
  const shown = quizzes.filter(q => q.cls === cls && (!query || (q.chapter + " " + q.topic).toLowerCase().includes(query)));
  if (!quizzes.some(q => q.cls === cls)) {
    list.innerHTML = `<div class="panel empty"><strong>No Class ${esc(cls)} ${esc(subject)} quizzes yet</strong><span>Switch class at the top, or create quizzes for this class with the quiz builder.</span></div>`;
    return;
  }
  if (!shown.length) {
    list.innerHTML = `<div class="panel empty"><strong>No topics match "${esc(query)}"</strong><span>Try a shorter word, or clear the search.</span></div>`;
    return;
  }
  const chapters = {};
  shown.forEach(q => ((chapters[q.chapter] = chapters[q.chapter] || {})[q.topic] = (chapters[q.chapter][q.topic] || [])).push(q));
  const names = Object.keys(chapters).sort(natural);
  list.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">` + names.map((ch, i) => {
    const topics = Object.keys(chapters[ch]).sort(natural);
    const n = topics.reduce((a, t) => a + chapters[ch][t].length, 0);
    return `<details class="chapter" ${query || i === 0 || names.length === 1 ? "open" : ""}>
      <summary><h2>${esc(ch)}</h2><span class="meta">${topics.length} topic${topics.length === 1 ? "" : "s"} · ${n} quiz${n === 1 ? "" : "zes"}</span></summary>
      ${topics.map(t => `<div class="topic">
        <div class="topic-name">${esc(t)}</div>
        <div class="sets">${chapters[ch][t].sort((a, b) => natural(a.set, b.set)).map(q => `
          <div class="set">
            <span class="tag">Set ${esc(q.set)}</span>
            <button class="btn sm ghost" data-copy="${esc(q.id)}">Copy link</button>
            <a class="btn sm accent" data-wa="${esc(q.id)}" href="#" target="_blank" rel="noopener">WhatsApp</a>
            <a class="btn sm ghost" href="${esc(q.link)}" target="_blank" rel="noopener" title="Open the form">Open</a>
            <a class="btn sm ghost" href="answers.html?subject=${encodeURIComponent(subject)}&amp;quiz=${encodeURIComponent(q.id)}" title="Answer key for teachers">Answers</a>
            <span data-sent="${esc(q.id)}">${sentTag(q)}</span>
          </div>`).join("")}
        </div>
      </div>`).join("")}
    </details>`;
  }).join("") + `</div>`;

  list.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const q = quizzes.find(x => x.id === b.dataset.copy);
    const ok = await copy(q.link);
    toast(ok ? "Link copied for " + q.topic + ", Set " + q.set + "." : "Couldn't copy. Use the Open button and copy the address instead.");
    if (ok) markSent(q);
  });
  list.querySelectorAll("[data-wa]").forEach(a => {
    a.onclick = () => {
      const q = quizzes.find(x => x.id === a.dataset.wa);
      a.href = "https://wa.me/?text=" + encodeURIComponent(message(q));
      markSent(q);
    };
  });
}

// "Sent 3 Oct · Mr. Naik": shows when a quiz was last shared, so the next set gets sent instead of a repeat
function sentTag(q) {
  if (!q.lastSent) return "";
  return `<span class="sent" title="Last sent ${esc(new Date(q.lastSent.at).toLocaleString("en-IN"))}">✓ Sent ${esc(day(q.lastSent.at))}${q.lastSent.by ? " · " + esc(q.lastSent.by) : ""}</span>`;
}
async function markSent(q) {
  try {
    const r = await api("markSent", { subject, quizId: q.id });
    q.lastSent = r.lastSent;
    const el = document.querySelector(`[data-sent="${CSS.escape(q.id)}"]`);
    if (el) el.innerHTML = sentTag(q);
  } catch (e) { /* recording a send is best-effort; the link was still shared */ }
}

function message(q) {
  const due = document.getElementById("due").value.trim();
  let m = `*${q.subject} quiz* – ${classLabel(q.cls)}\n${q.chapter}\n${q.topic} (Set ${q.set})\n\nAttempt it on your own, without books. Write your full name the same way every time.\n${q.link}`;
  if (due) m += `\n\nSubmit by: ${due}`;
  return m;
}
</script>
</body>
</html>
