<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main id="main"><p class="loading">Loading…</p></main>

<script>
const { DEMO, CFG, esc, api, me, header, ls, token, TOKEN, ME } = Portal;
const main = document.getElementById("main");
const params = new URLSearchParams(location.search);
const next = params.get("next");
const safeNext = next && /^(quizzes|analytics|report|attendance|overview|answers|users|tests)\.html(\?[\w=&%.\-+]*)?$/.test(next) ? next : null;

function showSignIn(errorText) {
  header("signin", null);
  main.innerHTML = `
    <section class="signin">
      ${Portal.logoHtml("logo-lg")}
      <div>
        <h1>Teacher sign-in</h1>
        <p class="lede">Sign in with the Google account the centre added to the teacher list.</p>
      </div>
      ${errorText ? `<div class="notice bad" role="alert">${esc(errorText)}</div>` : ""}
      <div id="gbtn">${DEMO ? `<button class="btn accent" id="demo-in">Continue in demo mode</button>` : `<p class="meta">Loading Google sign-in…</p>`}</div>
    </section>`;
  if (DEMO) { document.getElementById("demo-in").onclick = afterSignIn; return; }
  loadGoogle(() => {
    google.accounts.id.initialize({ client_id: CFG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: true });
    const box = document.getElementById("gbtn"); box.innerHTML = "";
    google.accounts.id.renderButton(box, { theme: "outline", size: "large", shape: "pill", text: "signin_with", logo_alignment: "left" });
    if (!errorText) google.accounts.id.prompt();
  });
}

function loadGoogle(cb) {
  if (window.google && google.accounts) return cb();
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.onload = cb;
  s.onerror = () => { document.getElementById("gbtn").innerHTML = `<div class="notice bad">Couldn't load Google sign-in. Check your internet connection and reload the page.</div>`; };
  document.head.appendChild(s);
}

function onCredential(resp) {
  ls.set(TOKEN, resp.credential);
  ls.set(ME, null);
  afterSignIn();
}

async function afterSignIn() {
  main.innerHTML = `<p class="loading">Checking your access…</p>`;
  try {
    await me(true);
    if (safeNext) { location.replace(safeNext); return; }
    location.replace("index.html");
  } catch (e) {
    if (e.code === "signin") return;
    ls.set(TOKEN, null); ls.set(ME, null);
    document.querySelector(".top")?.remove(); document.querySelector(".demo-bar")?.remove();
    showSignIn(e.message);
  }
}

async function showHome() {
  let user;
  try { user = await me(); } catch (e) { if (e.code !== "signin") showSignIn(e.message); return; }
  header("home", user, { context: true });
  const first = (user.name || "").split(" ")[0];
  const subject = Portal.getSubject(user);
  const counts = user.quizCounts || {};
  main.innerHTML = `
    <div>
      <h1>${first ? "Hello, " + esc(first) : "Welcome"}</h1>
      <p class="lede" id="h-lede"></p>
    </div>
    <div class="cards">
      <a class="card alt" href="attendance.html">
        <span class="label">Today</span><b>Take attendance</b>
        <span class="meta" id="h-att">Checking today's register…</span>
        <span class="go">Open register →</span></a>
      <a class="card alt" href="tests.html">
        <span class="label">Marks</span><b>Enter test marks</b>
        <span class="meta" id="h-test">Checking tests…</span>
        <span class="go">Open tests →</span></a>
      <a class="card alt" href="quizzes.html">
        <span class="label">Quizzes</span><b>Send a quiz</b>
        <span class="meta">${counts[subject] || 0} ${esc(subject)} quiz${counts[subject] === 1 ? "" : "zes"}</span>
        <span class="go">Find a quiz →</span></a>
      <a class="card alt" href="analytics.html">
        <span class="label">Results</span><b>See results</b>
        <span class="meta">Quiz scores, weak topics and student reports</span>
        <span class="go">Open results →</span></a>
    </div>
    ${user.isAdmin ? `<h2>Admin</h2>
    <div class="cards">
      <a class="card" href="overview.html">
        <span class="label">Whole centre</span><b>Overview</b>
        <span class="meta">All subjects and classes in one place</span>
        <span class="go">Open overview →</span></a>
      <a class="card" href="users.html">
        <span class="label">Access</span><b>Users</b>
        <span class="meta">Add or remove teachers and choose their subjects</span>
        <span class="go">Manage users →</span></a>
    </div>` : ""}`;
  if (!subject) { document.getElementById("h-lede").textContent = "Your account has no subjects yet. Ask an admin to add them on the Users page."; return; }
  homeStatus(subject);
  document.addEventListener("portal:class", () => homeStatus(subject));
}

// Today's register and the latest test for the chosen subject and class
async function homeStatus(subject) {
  const cls = Portal.getClass();
  const d = new Date(), today = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  document.getElementById("h-lede").innerHTML = `Working on <strong>${esc(subject)} · Class ${esc(cls)}</strong>. Change it with the button at the top.`;
  const att = document.getElementById("h-att"), tst = document.getElementById("h-test");
  att.textContent = "Checking today's register…"; tst.textContent = "Checking tests…";
  const [a, t] = await Promise.allSettled([api("attendance", { subject, cls, date: today }), api("tests", { subject, cls })]);
  if (a.status === "fulfilled") {
    const r = a.value, m = Object.values(r.marks || {});
    att.textContent = !r.students.length ? `No Class ${cls} students take ${subject}`
      : m.length ? `Done today ✓ ${m.filter(x => x === "P").length} present, ${m.filter(x => x === "A").length} absent`
      : `Not marked yet today · ${r.students.length} students`;
  } else att.textContent = "Mark who came to class";
  if (t.status === "fulfilled") {
    const r = t.value, last = r.tests[0];
    if (!last) tst.textContent = "No tests yet for this class";
    else {
      const done = Object.keys(r.marks[last.id] || {}).length, n = r.students.length;
      tst.textContent = done < n ? `${last.name}: ${done} of ${n} entered` : `${last.name}: all ${n} entered ✓`;
    }
  } else tst.textContent = "Enter and compare test marks";
}

if (DEMO ? ls.get(ME) : token()) showHome(); else showSignIn();
</script>
</body>
</html>
