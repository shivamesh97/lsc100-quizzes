<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attendance – Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main id="main"><p class="loading">Loading…</p></main>

<script>
const { esc, api, me, header, prefs, toast, copy, natural } = Portal;
const main = document.getElementById("main");
const pad = n => String(n).padStart(2, "0");
const isoToday = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const niceDate = iso => { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }); };
const pct = (p, t) => t ? Math.round(p / t * 100) : null;

let user, subject = "", date = isoToday(), reg = null, marks = {}, saved = {}, busy = false;

(async function start() {
  try { user = await me(); } catch (e) { if (e.code !== "signin") main.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  header("attendance", user, { context: true });
  subject = Portal.getSubject(user);
  main.innerHTML = `<div id="body" style="display:flex;flex-direction:column;gap:16px"><p class="loading">Loading the register…</p></div>`;
  document.addEventListener("portal:class", () => load());
  window.addEventListener("beforeunload", e => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
  load();
})();

function dirty() { return Object.keys(marks).some(k => marks[k] !== saved[k]); }
function leaveOk() { return !dirty() || window.confirm("You have unsaved attendance. Leave without saving?"); }

async function load() {
  const body = document.getElementById("body");
  body.innerHTML = `<p class="loading">Loading the register…</p>`;
  try { reg = await api("attendance", { subject, cls: Portal.getClass(), date }); }
  catch (e) { if (e.code !== "signin") body.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  saved = Object.assign({}, reg.marks); marks = Object.assign({}, reg.marks);
  render();
}

// Tabs: Register (mark today's class) / Past classes / By student
let tab = "register";
function render() {
  const body = document.getElementById("body");
  const cls = Portal.getClass();
  const list = reg.students;
  const head = `<div class="page-head"><div><h1>Attendance</h1><p class="lede">${esc(subject)} · Class ${esc(cls)}</p></div></div>`;
  if (!list.length) {
    body.innerHTML = head + `<div class="panel empty"><strong>No Class ${esc(cls)} students take ${esc(subject)}</strong><span>Add them in the Students tab of the database sheet, with ${esc(subject)} in their Subjects. Or pick another class with the button at the top.</span></div>`;
    return;
  }
  body.innerHTML = head + `
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="register" aria-selected="${tab === "register"}">Register</button>
      <button class="tab" role="tab" data-tab="past" aria-selected="${tab === "past"}">Past classes <span class="meta">${reg.sessions.length}</span></button>
      <button class="tab" role="tab" data-tab="students" aria-selected="${tab === "students"}">By student</button>
    </div>
    ${tab === "past" ? pastHtml() : tab === "students" ? studentsHtml(list) : registerHtml(list)}`;

  body.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (tab === "register" && b.dataset.tab !== "register" && !leaveOk()) return; if (tab === "register" && b.dataset.tab !== "register") { marks = Object.assign({}, saved); } tab = b.dataset.tab; render(); });
  body.querySelectorAll("[data-date]").forEach(b => b.onclick = () => { date = b.dataset.date; tab = "register"; load(); });
  if (tab !== "register") return;

  document.getElementById("a-date").onchange = e => { if (!e.target.value) return; if (!leaveOk()) { e.target.value = date; return; } date = e.target.value; load(); };
  body.querySelectorAll(".att-toggle button").forEach(b => b.onclick = () => {
    marks[b.dataset.id] = b.dataset.v;
    const row = b.closest(".att-row");
    row.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    refreshCounts();
  });
  document.getElementById("all-p").onclick = () => { list.forEach(s => { if (!marks[s.id]) marks[s.id] = "P"; }); render(); };
  document.getElementById("save").onclick = save;
  const cp = document.getElementById("copy-absent");
  if (cp) {
    cp.onclick = async () => toast(await copy(absentText(list)) ? "Absent list copied." : "Couldn't copy.");
    document.getElementById("wa-absent").onclick = e => { e.currentTarget.href = "https://wa.me/?text=" + encodeURIComponent(absentText(list)); };
  }
}

function registerHtml(list) {
  const counts = { P: 0, A: 0 };
  list.forEach(s => { if (marks[s.id]) counts[marks[s.id]]++; });
  const unmarked = list.length - counts.P - counts.A;
  const already = Object.keys(saved).length > 0;
  const dupes = {};
  list.forEach(s => { dupes[s.name] = (dupes[s.name] || 0) + 1; });
  return `<section class="panel">
      <div class="page-head" style="align-items:flex-end">
        <label class="field" style="flex:0 1 220px"><span class="label">Date of the class</span><input class="input" id="a-date" type="date" value="${date}" max="${isoToday()}"></label>
        <button class="btn sm ghost" type="button" id="all-p">Mark all present</button>
      </div>
      <span class="meta">${esc(niceDate(date))} · ${already ? "Saved earlier. Changes update the register." : "Not saved yet."}</span>
      <div class="att-counts" role="status">
        <span class="pill good">✓ ${counts.P} present</span>
        <span class="pill bad">✗ ${counts.A} absent</span>
        ${unmarked ? `<span class="pill none">${unmarked} not marked</span>` : ""}
      </div>
      <div class="att-list">${list.map(s => {
        const t = reg.totals[s.id], p = t ? pct(t.p, t.t) : null;
        return `<div class="att-row" data-row="${esc(s.id)}">
          <div style="min-width:0"><strong>${esc(s.name)}</strong>${dupes[s.name] > 1 ? ` <span class="meta">${esc(s.id)}</span>` : ""}
            <div class="meta">${p == null ? "No attendance yet" : `${p}% attended`}${s.school ? " · " + esc(s.school) : ""}</div></div>
          <div class="att-toggle" role="group" aria-label="Attendance for ${esc(s.name)}">
            <button type="button" class="p" data-id="${esc(s.id)}" data-v="P" aria-pressed="${marks[s.id] === "P"}">Present</button>
            <button type="button" class="a" data-id="${esc(s.id)}" data-v="A" aria-pressed="${marks[s.id] === "A"}">Absent</button>
          </div></div>`;
      }).join("")}</div>
      <div class="att-save">
        <button class="btn accent" type="button" id="save" ${unmarked || !dirty() ? "disabled" : ""}>${already ? "Save changes" : "Save attendance"}</button>
        <span class="meta" id="save-note">${unmarked ? `Mark all ${list.length} students to save.` : dirty() ? "" : "All saved."}</span>
      </div>
      ${counts.A && !dirty() ? absentBox(list) : ""}
    </section>`;
}

function pastHtml() {
  if (!reg.sessions.length) return `<div class="panel empty"><strong>No classes marked yet</strong><span>Each register you save appears here. Tap one to check or correct it.</span></div>`;
  return `<section class="panel" style="padding:6px 12px"><div class="rows">${reg.sessions.slice(0, 30).map(x => {
    const p = pct(x.present, x.present + x.absent);
    return `<button type="button" class="rowi" data-date="${esc(x.date)}" ${x.date === date ? 'aria-current="true"' : ""}>
      <span class="main"><strong>${esc(niceDate(x.date))}</strong><span class="meta">${x.present} present · ${x.absent} absent</span></span>
      <span class="side"><span class="big">${p}%</span><span class="mini" aria-hidden="true" style="margin:0"><i style="width:${p}%"></i></span></span>
      <span class="go-arrow" aria-hidden="true">›</span></button>`;
  }).join("")}</div></section>`;
}

function studentsHtml(list) {
  return `<section class="panel" style="padding:6px 12px">
    <p class="meta" style="margin:8px 4px">Lowest attendance first. Below 75% is flagged.</p>
    <div class="rows">${list.slice().sort((a, b) => (pctOf(a) ?? 200) - (pctOf(b) ?? 200) || natural(a.name, b.name)).map(s => {
      const t = reg.totals[s.id], p = pctOf(s);
      return `<div class="rowi">
        <span class="main"><strong>${esc(s.name)}</strong><span class="meta">${t ? `${t.p} of ${t.t} classes` : "No classes yet"}</span></span>
        <span class="side">${p == null ? `<span class="meta">—</span>` : `<span class="big">${p}%</span>${p < 75 ? `<span class="pill bad">⚠ Low</span>` : ""}`}</span>
      </div>`;
    }).join("")}</div></section>`;
}

function pctOf(s) { const t = reg.totals[s.id]; return t ? pct(t.p, t.t) : null; }

// Update counts and the Save button without re-drawing the list
function refreshCounts() {
  const list = reg.students, counts = { P: 0, A: 0 };
  list.forEach(s => { if (marks[s.id]) counts[marks[s.id]]++; });
  const unmarked = list.length - counts.P - counts.A;
  document.querySelector(".att-counts").innerHTML = `<span class="pill good">✓ ${counts.P} present</span><span class="pill bad">✗ ${counts.A} absent</span>${unmarked ? `<span class="pill none">${unmarked} not marked</span>` : ""}`;
  const btn = document.getElementById("save");
  btn.disabled = unmarked > 0 || !dirty();
  document.getElementById("save-note").textContent = unmarked ? `Mark all ${list.length} students to save.` : dirty() ? "" : "All saved.";
}

async function save() {
  if (busy) return;
  busy = true;
  const btn = document.getElementById("save");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    reg = await api("saveAttendance", { subject, cls: Portal.getClass(), date, marks });
    saved = Object.assign({}, reg.marks); marks = Object.assign({}, reg.marks);
    toast("Attendance saved for " + niceDate(date) + ".");
    render();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Save attendance";
    toast(e.code === "future_date" ? "You can't mark attendance for a future date." : e.message);
  } finally { busy = false; }
}

function absentText(list) {
  const names = list.filter(s => marks[s.id] === "A").map(s => s.name);
  return `*Absent today* – ${subject}, Class ${Portal.getClass()}, ${niceDate(date)}\n${names.map((n, i) => `${i + 1}. ${n}`).join("\n")}`;
}
function absentBox(list) {
  const names = list.filter(s => marks[s.id] === "A").map(s => s.name);
  return `<div class="notice" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
    <span><strong>Absent:</strong> ${names.map(esc).join(", ")}</span>
    <span class="tools"><button class="btn sm ghost" type="button" id="copy-absent">Copy list</button>
    <a class="btn sm ghost" id="wa-absent" href="#" target="_blank" rel="noopener">WhatsApp</a></span></div>`;
}
</script>
</body>
</html>
